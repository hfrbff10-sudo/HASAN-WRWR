<style>
:root {
  /* Layout: one physical card floating in 3D space. It tilts toward the pointer and
     sways on its own; photo, name and buttons sit at different depths above its face. */
  --space: #060b1a;       /* page background */
  --face: #0e1a3a;        /* card face */
  --face-hi: #1c3166;     /* card highlight edge */
  --edge: #02050d;        /* button and card thickness */
  --line: #2b4480;
  --gold: #f0c66a;        /* accent */
  --gold-deep: #b5852f;
  --paper: #f6f1e6;
  --muted: #9fb0d6;
  --display: "Aref Ruqaa", "Cormorant Garamond", "Noto Naskh Arabic", "Geeza Pro", serif;
  --body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background:
    radial-gradient(60% 45% at 50% 18%, #12265a 0%, transparent 70%),
    var(--space);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.6;
  padding: 48px 16px 72px;
  min-height: 100%;
  overflow-x: hidden;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.scene {
  position: relative; z-index: 1;
  perspective: 1100px;
  display: flex;
  justify-content: center;
}
.card {
  --rx: 0deg; --ry: 0deg;
  position: relative;
  width: 100%;
  max-width: 400px;
  padding: 36px 24px 28px;
  border-radius: 28px;
  background: linear-gradient(155deg, var(--face-hi) 0%, var(--face) 38%, #091228 100%);
  border: 1px solid var(--line);
  transform-style: preserve-3d;
  transform: rotateX(var(--rx)) rotateY(var(--ry));
  box-shadow:
    0 2px 0 #3554a0 inset,
    0 10px 0 var(--edge),
    0 44px 60px -18px rgba(0,0,0,.75),
    0 0 90px -10px rgba(60,110,230,.5);
  display: flex;
  flex-direction: column;
  gap: 26px;
  will-change: transform;
}
.glare {
  position: absolute; inset: 0;
  border-radius: inherit;
  background: radial-gradient(420px circle at var(--gx, 30%) var(--gy, 0%), rgba(255,236,190,.16), transparent 60%);
  pointer-events: none;
}
header {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  text-align: center;
  transform-style: preserve-3d;
}
.photo {
  width: 128px; height: 128px;
  border-radius: 50%;
  transform: translateZ(70px);
  background: linear-gradient(145deg, var(--gold), var(--gold-deep));
  padding: 4px;
  box-shadow: 0 18px 28px -8px rgba(0,0,0,.7);
  position: relative;
}
.photo::before, .photo::after {
  content: ""; position: absolute; inset: -12px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--gold);
  border-left-color: rgba(240,198,106,.4);
  animation: spin 5s linear infinite;
  pointer-events: none;
}
.photo::after { inset: -22px; border-top-color: rgba(90,140,255,.7); border-left-color: transparent; border-bottom-color: rgba(240,198,106,.25); animation-duration: 9s; animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { opacity: .0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.links li { animation: pop .6s both; }
.links li:nth-child(2) { animation-delay: .1s; } .links li:nth-child(3) { animation-delay: .2s; } .links li:nth-child(4) { animation-delay: .3s; } .links li:nth-child(5) { animation-delay: .4s; }
.ico svg { animation: bob 3s ease-in-out infinite; }
.links li:nth-child(2) .ico svg { animation-delay: .4s; } .links li:nth-child(3) .ico svg { animation-delay: .8s; } .links li:nth-child(4) .ico svg { animation-delay: 1.2s; }
@keyframes bob { 50% { transform: translateY(-3px) scale(1.08); } }
.photo > * {
  width: 100%; height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: grid; place-items: center;
  background: #091228;
  font-family: var(--display);
  font-size: 3.6rem;
  color: var(--gold);
}
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: 2.6rem;
  line-height: 1.25;
  margin: 0;
  transform: translateZ(48px);
  background: linear-gradient(100deg, var(--paper) 0%, var(--paper) 42%, #ffe9a8 48%, var(--gold) 50%, #ffe9a8 52%, var(--paper) 58%, var(--paper) 100%);
  background-size: 300% 100%;
  background-position: 100% 0;
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,.55)) drop-shadow(0 0 16px rgba(240,198,106,.3));
  animation: shine 5s ease-in-out 3s infinite;
  padding: 0 .15em;
  text-wrap: balance;
}
.handle {
  color: var(--gold);
  font-weight: 500;
  transform: translateZ(34px);
}
.links {
  display: flex; flex-direction: column; gap: 16px;
  list-style: none; margin: 0; padding: 0;
  position: relative;
}
.row {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 66px;
  padding: 11px 16px;
  background: linear-gradient(180deg, #1a2d5e, #122046);
  border: 1px solid var(--line);
  border-radius: 16px;
  color: inherit;
  text-decoration: none;
  box-shadow: 0 6px 0 var(--edge), 0 14px 18px -8px rgba(0,0,0,.6);
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
a.row:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 0 var(--edge), 0 18px 22px -8px rgba(0,0,0,.65); }
a.row:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
.ico {
  flex: none;
  width: 42px; height: 42px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: linear-gradient(145deg, var(--gold), var(--gold-deep));
  color: #1a1304;
  box-shadow: 0 3px 0 #6e4d18;
}
.ico svg { width: 22px; height: 22px; }
.txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.label { font-weight: 600; font-size: 1.0625rem; }
.sub { color: var(--muted); font-size: .875rem; direction: ltr; text-align: right; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.row.phone { flex-wrap: wrap; }
.row.phone a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 14px; flex: 1; min-width: 190px; }
button.copy {
  font: inherit; font-size: .875rem; font-weight: 500;
  color: var(--gold);
  background: #091228;
  border: 1px solid var(--gold-deep);
  border-radius: 999px;
  padding: 6px 14px;
  cursor: pointer;
  box-shadow: 0 3px 0 var(--edge);
}
button.copy:active { transform: translateY(3px); box-shadow: none; }

@keyframes shine { 0% { background-position: 100% 0; } 45%, 100% { background-position: 0% 0; } }
html[lang="en"] h1 { font-family: "Cormorant Garamond", Georgia, serif; letter-spacing: .01em; }
html[dir="ltr"] .sub { text-align: left; }

/* language switch */
.lang {
  position: absolute; top: 14px; inset-inline-end: 14px;
  font: inherit; font-size: .8125rem; font-weight: 600;
  min-width: 44px; padding: 5px 12px;
  color: var(--gold); background: #091228;
  border: 1px solid var(--gold-deep); border-radius: 999px;
  cursor: pointer; box-shadow: 0 3px 0 var(--edge);
  z-index: 2;
}
.lang:active { transform: translateY(3px); box-shadow: none; }

/* save contact */
.save {
  font: inherit; font-weight: 600; font-size: 1.0625rem;
  width: 100%; min-height: 58px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: #1a1304;
  background: linear-gradient(145deg, #ffe09a, var(--gold) 45%, var(--gold-deep));
  border: 0; border-radius: 16px; cursor: pointer;
  box-shadow: 0 6px 0 #6e4d18, 0 16px 22px -8px rgba(0,0,0,.65);
  transition: transform .12s, box-shadow .12s;
}
.save svg { width: 22px; height: 22px; }
.save:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #6e4d18, 0 20px 24px -8px rgba(0,0,0,.7); }
.save:active { transform: translateY(5px); box-shadow: 0 1px 0 #6e4d18; }
.note { margin: -14px 0 0; text-align: center; color: var(--muted); font-size: .8125rem; min-height: 1.3em; }

.visits { margin: -10px 0 0; display: flex; align-items: center; justify-content: center; gap: 7px; color: var(--muted); font-size: .8125rem; }
.visits[hidden] { display: none; }
.visits svg { width: 16px; height: 16px; color: var(--gold); }
.visits b { color: var(--gold); font-variant-numeric: tabular-nums; }

/* light travelling round the card edge */
@property --spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
.card::before {
  content: ""; position: absolute; inset: -2px;
  border-radius: 30px; padding: 2.5px;
  background: conic-gradient(from var(--spin), transparent 0deg, transparent 250deg, var(--gold-deep) 300deg, #fff1c9 345deg, var(--gold) 355deg, transparent 360deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: edge 4.5s linear infinite;
  pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(240,198,106,.7));
}
@keyframes edge { to { --spin: 360deg; } }

/* live Baghdad clock */
.clock { display: inline-flex; align-items: center; gap: 7px; color: var(--paper); font-size: .9375rem; font-variant-numeric: tabular-nums; direction: ltr; transform: translateZ(30px); margin-top: -6px; }
.clock svg { width: 16px; height: 16px; color: var(--gold); }

/* availability */
.status {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 14px; border-radius: 999px;
  background: #091228; border: 1px solid var(--line);
  font-size: .875rem; font-weight: 500;
  transform: translateZ(26px);
}
.status .dot { width: 10px; height: 10px; border-radius: 50%; background: #7d8799; flex: none; }
.status.on { border-color: #2f8f5b; }
.status.on .dot { background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { to { box-shadow: 0 0 0 9px rgba(61,220,132,0); } }
.days { color: var(--muted); font-size: .8125rem; transform: translateZ(22px); margin-top: -8px; }

/* actions row */
.actions { display: flex; gap: 12px; }
.actions .save { flex: 1; }
.share {
  flex: none; width: 58px; min-height: 58px;
  display: grid; place-items: center;
  color: var(--gold); background: linear-gradient(180deg, #1a2d5e, #122046);
  border: 1px solid var(--gold-deep); border-radius: 16px; cursor: pointer;
  box-shadow: 0 6px 0 var(--edge), 0 16px 22px -8px rgba(0,0,0,.65);
  transition: transform .12s, box-shadow .12s;
}
.share svg { width: 24px; height: 24px; }
.share:hover { transform: translateY(-2px); }
.share:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--edge); }

/* intro: the name is written by hand, then the curtain lifts */
.intro {
  position: fixed; inset: 0; z-index: 10;
  display: grid; place-items: center;
  background: radial-gradient(60% 45% at 50% 45%, #12265a 0%, var(--space) 75%);
  animation: lift .7s ease 2.9s forwards;
  cursor: pointer;
}
.intro svg { width: min(86vw, 520px); height: auto; overflow: visible; }
.intro text {
  font-family: var(--display); font-weight: 700; font-size: 92px;
  fill: var(--gold); fill-opacity: 0;
  stroke: var(--gold); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
  stroke-dasharray: 900; stroke-dashoffset: 900;
  animation: write 2.2s ease .25s forwards, ink .7s ease 2.1s forwards;
}
html[lang="en"] .intro text { font-family: "Cormorant Garamond", Georgia, serif; font-size: 78px; }
.intro line { stroke: var(--gold); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 320; stroke-dashoffset: 320; animation: write 1s ease 1.7s forwards; }
@keyframes write { to { stroke-dashoffset: 0; } }
@keyframes ink { to { fill-opacity: 1; } }
@keyframes lift { to { opacity: 0; visibility: hidden; transform: scale(1.06); } }
.intro.skip { animation: lift .35s ease forwards; }
@media (max-width: 380px) {
  h1 { font-size: 2.2rem; }
  .photo { width: 108px; height: 108px; }
}
@media (prefers-reduced-motion: reduce) { .row { transition: none; } .photo::before, .photo::after, .links li, .ico svg, h1, .card::before, .status.on .dot { animation: none; } .intro { display: none; } }
</style>

<script>
const card = document.getElementById('card');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
let tx = 0, ty = 0, cx = 0, cy = 0, lastMove = 0;

function point(e) {
  const r = card.getBoundingClientRect();
  const px = (e.clientX - r.left) / r.width - 0.5;
  const py = (e.clientY - r.top) / r.height - 0.5;
  ty = Math.max(-1, Math.min(1, px * 2)) * 12;
  tx = Math.max(-1, Math.min(1, py * 2)) * -9;
  card.style.setProperty('--gx', (px + 0.5) * 100 + '%');
  card.style.setProperty('--gy', (py + 0.5) * 100 + '%');
  lastMove = performance.now();
}
if (!still) {
  window.addEventListener('pointermove', point, { passive: true });
  (function frame(t) {
    if (t - lastMove > 1800) {           // idle: the card sways on its own
      ty = Math.sin(t / 1700) * 9;
      tx = Math.cos(t / 2300) * 4;
    }
    cx += (tx - cx) * 0.08;
    cy += (ty - cy) * 0.08;
    card.style.setProperty('--rx', cx.toFixed(2) + 'deg');
    card.style.setProperty('--ry', cy.toFixed(2) + 'deg');
    requestAnimationFrame(frame);
  })(0);
}

// background: glowing dust flying toward the viewer in 3D
(function () {
  const c = document.getElementById('sky'), g = c.getContext('2d');
  let w, h, pts = [];
  const N = 110, D = 900;
  function size() {
    const r = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    c.width = w * r; c.height = h * r; g.setTransform(r, 0, 0, r, 0, 0);
  }
  function seed(p, far) {
    p.x = (Math.random() - .5) * 1600; p.y = (Math.random() - .5) * 1600;
    p.z = far ? D : Math.random() * D; p.s = Math.random() * 1.6 + .6;
    p.c = ['#f0c66a', '#fff1c9', '#5a8cff'][Math.floor(Math.random() * 3)];
  }
  function draw(move) {
    g.clearRect(0, 0, w, h);
    for (const p of pts) {
      if (move) { p.z -= 1.1; if (p.z < 1) seed(p, true); }
      const k = 420 / p.z, x = w / 2 + p.x * k, y = h / 2 + p.y * k;
      if (x < -20 || x > w + 20 || y < -20 || y > h + 20) { if (move) seed(p, true); continue; }
      g.globalAlpha = Math.min(1, (1 - p.z / D) * 1.2) * .8;
      g.fillStyle = p.c;
      g.beginPath(); g.arc(x, y, p.s * k * .6 + .4, 0, 6.283); g.fill();
    }
  }
  size(); addEventListener('resize', size);
  for (let i = 0; i < N; i++) { const p = {}; seed(p, false); pts.push(p); }
  if (still) draw(false);
  else (function loop() { draw(true); requestAnimationFrame(loop); })();
})();

// language
const T = {
  ar: { on: 'متاح الآن', off: 'غير متاح حالياً', link: 'تم نسخ رابط البطاقة', nolink: 'انسخ الرابط من شريط العنوان', shareTitle: 'بطاقة حسن أسعد', copied: 'تم النسخ', saved: 'تم تنزيل جهة الاتصال، افتحها واحفظها', nosave: 'الحفظ يشتغل من رابط الصفحة المباشر. الرقم: 07707368351' },
  en: { on: 'Available now', off: 'Not available right now', link: 'Card link copied', nolink: 'Copy the link from the address bar', shareTitle: 'Hasan Asaad', copied: 'Copied', saved: 'Contact downloaded. Open it to save.', nosave: 'Saving works from the direct page link. Number: 07707368351' }
};
const langBtn = document.getElementById('lang');
function setLang(l) {
  LANG = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-ar]').forEach(el => { el.textContent = el.dataset[l]; });
  langBtn.textContent = l === 'ar' ? 'EN' : 'ع';
  document.getElementById('introName').textContent = l === 'ar' ? 'حسن أسعد' : 'Hasan Asaad';
  document.getElementById('note').textContent = '';
  if (typeof showStatus === 'function') showStatus();
  try { localStorage.setItem('card-lang', l); } catch (e) {}
}
setLang(LANG);
langBtn.addEventListener('click', () => setLang(LANG === 'ar' ? 'en' : 'ar'));

// live clock, always Baghdad time
function showClock() {
  let t;
  try {
    t = new Intl.DateTimeFormat(LANG === 'ar' ? 'ar-IQ-u-nu-latn' : 'en-US', { timeZone: 'Asia/Baghdad', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }).format(new Date());
  } catch (e) {
    t = new Date(Date.now() + 3 * 3600 * 1000).toISOString().slice(11, 19);
  }
  document.getElementById('clock').textContent = t;
}
showClock();
setInterval(showClock, 1000);

// availability: Sunday to Thursday, by Baghdad time (UTC+3)
function showStatus() {
  const day = new Date(Date.now() + 3 * 3600 * 1000).getUTCDay(); // 0 = Sunday
  const on = day <= 4;
  document.getElementById('status').classList.toggle('on', on);
  document.getElementById('statusText').textContent = T[LANG][on ? 'on' : 'off'];
}
showStatus();
setInterval(showStatus, 60000);

// share the card: system share sheet where it exists, otherwise copy the link
document.getElementById('share').addEventListener('click', async () => {
  const note = document.getElementById('note');
  const url = location.href.split('#')[0];
  try {
    if (navigator.share) { await navigator.share({ title: T[LANG].shareTitle, url }); return; }
    await navigator.clipboard.writeText(url);
    note.textContent = T[LANG].link;
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    try { await navigator.clipboard.writeText(url); note.textContent = T[LANG].link; }
    catch (e2) { note.textContent = T[LANG].nolink; }
  }
});

// intro: tap to skip
const intro = document.getElementById('intro');
intro.addEventListener('click', () => intro.classList.add('skip'));

// soft click sound on every button and link
let actx;
function tick() {
  try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) {}
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(1150, t);
    o.frequency.exponentialRampToValueAtTime(520, t + 0.07);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.11, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + 0.12);
  } catch (e) {}
}
document.querySelectorAll('a.row, .row.phone a, button').forEach(el => el.addEventListener('pointerdown', tick));
